# =====================================================================
# Smart Trade Multi Account - Configuration
# =====================================================================
# IMPORTANT: This file contains strategy and risk parameters ONLY.
# Never put broker passwords, investor passwords, or API secrets here.
# Use MT5 terminal's saved login or OS keychain for credentials.
# =====================================================================

app:
  name: Smart Trade Multi Account
  version: "0.1"
  environment: live          # "demo" or "live"
  live_trading_enabled: true  # Enabled for live trading
  log_level: INFO
  timezone: Asia/Jakarta

server:
  host: "0.0.0.0"
  port: 8000
  ea_auth_token: "KunciAmanSTMA2026"  # Shared secret between Python and EA
  command_poll_interval_seconds: 1
  status_push_interval_seconds: 5
  command_timeout_seconds: 10
  max_command_age_seconds: 30

strategy:
  strategy_id: stma-xau-v1
  symbol: XAUUSD
  direction_mode: signal_based   # signal_based (supports BUY + SELL)
  default_lot: 0.01
  max_active_cycles_per_symbol: 1
  entry_model: hybrid            # hybrid = distance + signal_confirmation

  # ── Exit Mode ──────────────────────────────────────────────────────────────
  # "individual" = TP per posisi masing-masing (DEFAULT, disarankan)
  # "basket"     = close semua posisi saat total basket profit mencapai target
  exit_mode: individual
  basket_target_usd: 10.00       # Dipakai hanya jika exit_mode = basket

  # ── TP / SL Default ────────────────────────────────────────────────────────
  tp_mode: individual            # individual | basket (sync dengan exit_mode)
  individual_tp_points: 300      # TP per posisi (MT5 points, XAUUSD: 300 pts = $3.00 @0.01 lot)
  individual_sl_enabled: false   # DEFAULT: No SL. Gunakan TP saja.
  individual_sl_points: 0        # 0 = tidak kirim SL ke broker

  # ── Account 1 — M1 timeframe, max 3 layer ─────────────────────────────────
  account1_max_layers: 3
  account1_layer_distance_points: 200   # Adverse move antar layer Akun 1 (XAUUSD: ~$2.00)
  account1_signal_type: fractal_sr      # fractal_sr | ema_cross | distance_only
  account1_timeframe: M1

  # ── Account 2 — M15 timeframe, aktivasi jika Akun 1 penuh ─────────────────
  account2_max_layers: 3
  account2_activate_distance_points: 400  # Adverse dari LAST layer Akun 1 → aktifkan Akun 2
  account2_layer_distance_points: 300     # Adverse antar layer Akun 2 (XAUUSD: ~$3.00)
  account2_signal_type: ema_cross         # fractal_sr | ema_cross | distance_only
  account2_timeframe: M15

  # ── Account 3 — M15 timeframe, aktivasi jika Akun 2 penuh ─────────────────
  account3_max_layers: 3
  account3_activate_distance_points: 500  # Adverse dari LAST layer Akun 2 → aktifkan Akun 3
  account3_layer_distance_points: 400     # Adverse antar layer Akun 3 (XAUUSD: ~$4.00)
  account3_signal_type: ema_cross         # fractal_sr | ema_cross | distance_only
  account3_timeframe: M15

  # ── Entry Confirmation Zone ────────────────────────────────────────────────
  confirmation_zone_points: 30   # Price harus dalam zone ini dari S/R untuk konfirmasi entry

  # ── Trailing Stop (opsional) ───────────────────────────────────────────────
  trailing_enabled: false
  trailing_start_points: 150
  trailing_distance_points: 100
  trailing_step_points: 10

  # ── Execution Guard ────────────────────────────────────────────────────────
  max_spread_points: 50          # Tolak entry jika spread > ini
  signal_max_age_seconds: 60     # Sinyal lebih tua dari ini ditolak
  deviation_points: 10           # Allowed slippage on order execution

risk:
  aggregate_protection_enabled: true
  require_operator_resume_after_critical_trigger: true
  block_entries_if_account_stale: true
  account_stale_threshold_seconds: 30

  # Per-account limits
  max_layers_per_account: 3
  max_volume_per_account: 0.03
  max_floating_loss_per_account_usd: 50.0   # Batas floating loss per akun ($50)
  max_drawdown_per_account_pct: 15.0        # Batas drawdown per akun (15%)
  min_margin_level_pct: 200.0               # Minimum margin level (200%)
  max_order_failures_per_window: 5
  order_failure_window_seconds: 300

  # Aggregate (strategy-wide) limits
  max_strategy_positions: 9
  max_strategy_volume: 0.10                 # Total volume maksimal strategi (0.10 lot)
  max_strategy_floating_loss_usd: 150.0     # Total floating loss maksimal strategi ($150)
  max_strategy_drawdown_pct: 20.0           # Total drawdown maksimal strategi (20%)

accounts:
  - alias: account_1
    role: primary
    enabled: true
    login: null           # Fill in your MT5 account number (integer)
    server: null          # Fill in MT5 server name (string, e.g. "Exness-MT5Real")
    currency: USD         # Account deposit currency
    is_cent: false        # Set true if this is a cent account
    cent_divisor: 100     # Only used if is_cent=true
    magic_number: 20240001
    max_layers: 3
    default_lot: 0.01

  - alias: account_2
    role: secondary
    enabled: true
    symbol: XAUUSDm       # Broker specific symbol suffix
    login: null
    server: null
    currency: USD
    is_cent: false
    cent_divisor: 100
    magic_number: 20240002
    max_layers: 3
    default_lot: 0.01

  - alias: account_3
    role: tertiary
    enabled: true
    symbol: XAUUSDm       # Broker specific symbol suffix
    login: null
    server: null
    currency: USD
    is_cent: false
    cent_divisor: 100
    magic_number: 20240003
    max_layers: 3
    default_lot: 0.01
