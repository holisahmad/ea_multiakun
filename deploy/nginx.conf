# ==============================================================================
# Nginx Reverse Proxy Configuration for STMA Trading Controller
# Place in: /etc/nginx/sites-available/stma and symlink to /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    server_name your-domain-or-vps-ip.com;

    # Gzip Compression for fast mobile loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Client upload limits & timeouts
    client_max_body_size 10M;
    keepalive_timeout 65;

    # Reverse proxy to STMA Controller
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Header forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets support (if future streaming added)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for polling endpoints
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Direct redirect from root / to mobile dashboard
    location = / {
        return 302 /dashboard-ui/;
    }
}
